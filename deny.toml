# Configuration for cargo-deny
# See https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true
exclude = ["mdt_book"]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
  # RUSTSEC-2024-0449 (assigned 2026-10-12): `unsafe-libyaml` is unmaintained.
  # Transitive only, via `serde_yaml_ng` (the maintained `serde_yaml` fork);
  # no maintained pure-Rust YAML backend exists yet. Revisit when one lands.
  "RUSTSEC-2024-0449",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "Unlicense",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "MIT-0",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "snailquote"

# encoding_rs bundles WHATWG index data under BSD-3-Clause; serde-saphyr
# reads YAML through it to detect the input encoding.
[[licenses.exceptions]]
allow = ["BSD-3-Clause"]
crate = "encoding_rs"

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
