# Configuration for cargo-deny
# See https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true
exclude = ["mdt_book"]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
  # RUSTSEC-2026-0543 (issued 2026-11-17): `chrono` is unmaintained.
  # Informational; the maintainers published no patched release and recommend
  # `jiff` or `time` instead. mdt does not call chrono. `rmcp` requires it on
  # every target, and also enables `schemars`'s `chrono04` feature, so the
  # crate stays in the graph until rmcp migrates. Revisit when that happens.
  "RUSTSEC-2026-0543",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "Unlicense",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "MIT-0",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "snailquote"

# encoding_rs bundles WHATWG index data under BSD-3-Clause; serde-saphyr
# reads YAML through it to detect the input encoding.
[[licenses.exceptions]]
allow = ["BSD-3-Clause"]
crate = "encoding_rs"

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
