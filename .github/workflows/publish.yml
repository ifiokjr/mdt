name: publish

# Single workflow that builds release artifacts, publishes packages, and
# publishes the GitHub release. Triggered by a tag push (v*) so that crates.io
# and npm trusted publishing (OIDC) accept the run. workflow_dispatch is
# retained for manual retries where every package version already exists on its
# registry (monochange skips them, so no OIDC/OTP path is hit).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.9.0). Only used for manual retries; the tag-push event below is the primary trigger."
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  # Never cancel a publish mid-flight: a partial registry publish is worse than
  # a queued run waiting its turn.
  cancel-in-progress: false

# On a tag push github.ref_name is the tag (e.g. v0.9.0); on a manual
# workflow_dispatch retry inputs.tag is the tag.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  upload_assets:
    if: >-
      github.repository_owner == 'ifiokjr' &&
      startsWith(inputs.tag || github.ref_name, 'v')
    permissions:
      attestations: write
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # The release-pr tag job pushes the tag (firing this workflow) and then
      # creates the draft release. Wait for that draft release to exist before
      # uploading assets into it.
      - name: wait for draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for the draft release $RELEASE_TAG to be created by the release-pr tag job..."
          for attempt in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Draft release $RELEASE_TAG exists after $attempt attempt(s)."
              exit 0
            fi
            echo "  attempt $attempt/30: release not found yet; sleeping 10s"
            sleep 10
          done
          echo "::error::Release $RELEASE_TAG was not created within the wait window. Check the release-pr tag job." >&2
          exit 1
      - name: checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: setup cross toolchain
        if: startsWith(matrix.os, 'ubuntu') && !contains(matrix.target, '-musl')
        uses: taiki-e/setup-cross-toolchain-action@129361238c06ff2cc1c4ca5c5d2217af441ffdf6 # v1.40.1
        with:
          target: ${{ matrix.target }}
      - name: install cross
        if: contains(matrix.target, '-musl')
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2
        with:
          tool: cross
      - name: set static crt linkage
        if: endsWith(matrix.target, 'windows-msvc')
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS:-} -C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: upload binaries
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: mdt
          manifest-path: mdt_cli/Cargo.toml
          profile: release
          ref: refs/tags/${{ env.RELEASE_TAG }}
          archive: $bin-$target-$tag
          target: ${{ matrix.target }}
          tar: all
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256,sha512

  attest_assets:
    if: >-
      github.repository_owner == 'ifiokjr' &&
      startsWith(inputs.tag || github.ref_name, 'v')
    needs: upload_assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: download all release archives for attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-asset-attestations"
          mkdir -p "$asset_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'mdt-*' \
            --dir "$asset_dir"
          shopt -s nullglob
          archives=("$asset_dir"/*)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No release archives downloaded for $RELEASE_TAG" >&2
            exit 1
          fi
          sha256sum "$asset_dir"/*

      - name: attest all release archives
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/release-asset-attestations/*

      - name: verify all release archive attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP/release-asset-attestations"/*; do
            verified=false
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"; then
                verified=true
                break
              fi
              echo "Attestation for $archive is not available yet (attempt $attempt/5)."
              sleep 10
            done
            if [ "$verified" != true ]; then
              echo "::error::Failed to verify attestation for $archive" >&2
              exit 1
            fi
          done

  publish:
    needs: attest_assets
    environment: publisher
    permissions:
      contents: write
      id-token: write
    if: >-
      github.repository_owner == 'ifiokjr' &&
      startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: validate release tag input
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::Tag '$RELEASE_TAG' must be a release tag like v0.9.0" >&2
            exit 1
          fi
      - name: checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: verify tag checkout
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="$RELEASE_TAG"
          actual_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n1 "$expected_tag")"
          if [ "$actual_commit" != "$tag_commit" ]; then
            echo "::error::Checked-out commit $actual_commit does not match tag $expected_tag ($tag_commit)" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$actual_commit" refs/remotes/origin/main 2>/dev/null; then
            echo "::error::Tag $expected_tag ($actual_commit) is not on main" >&2
            exit 1
          fi
      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: setup node for publish
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          # No cache: this job runs a fresh `pnpm install` once per release and
          # the cache key would be shared across tags (cache-poisoning audit).
          package-manager-cache: false
      - name: install pnpm
        uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
        with:
          version: 10
      - name: build npm tooling
        run: pnpm install --no-frozen-lockfile && pnpm build
      - name: get crates oidc auth token
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: crates-oidc
      - name: download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "mdt-*-${RELEASE_TAG}.tar.gz" \
            --pattern "mdt-*-${RELEASE_TAG}.zip" \
            --dir "$RUNNER_TEMP/release-assets"
          find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f -print
      - name: populate platform packages with release binaries
        run: |
          set -euo pipefail
          pnpm node --import tsx scripts/npm/build-packages.ts \
            --release-tag "$RELEASE_TAG" \
            --assets-dir "$RUNNER_TEMP/release-assets"
      - name: populate cli npm package with launcher
        run: |
          set -euo pipefail
          chmod +x packages/m-d-t__cli/bin/mdt.js || true
      - name: check publish readiness
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          unset NODE_AUTH_TOKEN
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then
            rm -f "$NPM_CONFIG_USERCONFIG"
            unset NPM_CONFIG_USERCONFIG
          fi
          mc step publish-readiness --from HEAD --output "$RUNNER_TEMP/publish-readiness.json" --format json
        shell: devenv shell -- bash -e {0}
      - name: publish packages with monochange
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          # Stream child publish output so any auth prompt or hang is visible in
          # the job log instead of being buffered until process exit.
          PUBLISH_STREAM_OUTPUT: "true"
        run: |
          unset NODE_AUTH_TOKEN
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then
            rm -f "$NPM_CONFIG_USERCONFIG"
            unset NPM_CONFIG_USERCONFIG
          fi
          mc --log-level=info step publish-packages \
            --all \
            --output "$RUNNER_TEMP/publish-result.json" \
            --format json
        shell: devenv shell -- bash -e {0}
      - name: publish draft release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
