name: "docs-pages"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build docs from (tag, branch, or commit SHA). Defaults to the workflow ref."
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: install mdbook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: setup pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: build mdbook
        run: mdbook build docs

      - name: assemble site
        run: |
          mkdir -p site/assets
          cp docs/landing/index.html site/index.html
          cp assets/mdt-demo.gif assets/mdt-icon.svg assets/mdt-lockup-dark.svg site/assets/
          mv assets/mdt-lockup-dark.svg site/assets/mdt-lockup.svg
          cp -r docs/book site/book

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
