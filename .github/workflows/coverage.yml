name: "coverage"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  coverage:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: install JavaScript coverage tooling
        run: npm install --global c8@10

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: generate Rust coverage report
        run: cargo llvm-cov nextest --lcov --output-path rust-lcov.info
        shell: devenv shell -- bash -e {0}

      - name: generate JavaScript coverage report
        run: |
          rm -rf .node-coverage .node-lcov
          pnpm install --no-frozen-lockfile
          pnpm build
          NODE_V8_COVERAGE=.node-coverage \
            pnpm node --import tsx --test scripts/npm/tests/*.test.ts
          c8 report \
            --all \
            --reporter=lcovonly \
            --report-dir .node-lcov \
            --temp-directory .node-coverage \
            --include "scripts/npm/*.ts" \
            --exclude "**/tests/**"
          cp .node-lcov/lcov.info js-lcov.info

      - name: combine lcov reports
        run: cat rust-lcov.info js-lcov.info > lcov.info

      - name: upload lcov artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error

      - name: upload to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./lcov.info
          use_oidc: true
          fail_ci_if_error: false
          verbose: true
